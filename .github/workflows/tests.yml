name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import check (ловит синтаксис под конкретную версию Python)
        run: python -c "import qwenkit.cli, qwenkit.convert, qwenkit.providers, qwenkit.maps, qwenkit.pack, qwenkit.doctor, qwenkit.probe, qwenkit.setup_cmd; print('imports ok')"

      - name: Run tests
        run: python tests/test_qwenkit.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - name: ruff
        run: ruff check qwenkit tests qwenkit-cli
        continue-on-error: true
